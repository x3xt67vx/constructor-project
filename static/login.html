<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f7f7f7;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 25px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border: none;
            background: #4A90E2;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background: #357ecf;
        }
        a {
            display: block;
            margin-top: 15px;
            text-align: center;
            text-decoration: none;
            color: #4A90E2;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Вход</h2>

    <form id="loginForm">
        <input id="username" type="text" placeholder="Логин" required>
        <input id="password" type="password" placeholder="Пароль" required>

        <button type="submit">Войти</button>
    </form>

    <a href="/register">Создать аккаунт</a>
</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();

        const res = await fetch("/api/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (data.success) {
            window.location.href = "/home";
        } else {
            alert("Неверный логин или пароль!");
        }
    });
</script>


</body>
</html>
