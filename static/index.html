<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Конструктор визитки</title>
    <style>
        body { margin: 0; font-family: sans-serif; }
        #canvas { position: relative; width: 100vw; height: 100vh; background: #fafafa; }
        .component { position: absolute; padding: 5px; border: 1px solid #ccc; cursor: move; }
        .block.selected {
            outline: 2px dashed #4a90e2;
        }
    </style>
</head>
<body>
<div style="display: flex; height: 100vh;">
    <div id="canvas" style="flex: 1; position: relative; background: #fafafa;"></div>
    <div id="sidebar" style="width: 250px; background: #eaeaea; padding: 10px; box-sizing: border-box;">
        <h3>Компоненты</h3>
        <button class="template-btn" data-type="text">Текст</button>
        <button class="template-btn" data-type="image">Изображение</button>
        <button class="template-btn" data-type="profile">Профиль</button>
        <hr>
        <button id="delete-block">Удалить выбранный блок</button>
        <h3>Свойства выбранного блока</h3>
        <div id="style-editor">
            <label>URL картинки: <input type="text" id="edit-image"></label><br><br>
            <label>Фоновое изображение: <input type="text" id="edit-bg-image"></label><br><br>
            <button id="clear-bg-image">Удалить фон блока</button><br><br>
            <label>Текст: <input type="text" id="edit-text"></label><br><br>
            <label>Фон: <input type="color" id="edit-bg"></label><br><br>
            <label>Цвет: <input type="color" id="edit-color"></label><br><br>
            <label>Размер шрифта: <input type="number" id="edit-font" min="8" max="72"></label><br><br>
            <label>Ширина: <input type="number" id="edit-width" min="10" max="1000"></label><br><br>
            <label>Высота: <input type="number" id="edit-height" min="10" max="1000"></label><br><br>
        </div>
        <hr>
        <h3>Фон полотна</h3>
        <label>URL фона: <input type="text" id="canvas-bg-url"></label><br><br>
        <button id="clear-canvas-bg">Удалить фон</button>
        <hr>
        <button id="save-layout">Сохранить макет</button>
    </div>


</div>
<script type="module" src="/static/js/templates.js"></script>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
