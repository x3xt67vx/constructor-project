<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Конструктор визитки — Редактор</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header id="topbar">
    <div class="top-left">
        <button id="choose-template-btn" class="btn">Выбрать шаблон</button>
        <button class="template-btn btn" data-type="text">Добавить текст</button>
        <button class="template-btn btn" data-type="image">Добавить изображение</button>
        <button class="template-btn btn" data-type="profile">Добавить профиль</button>
    </div>

    <div class="top-right">
        <label class="inline-label">Фон полотна:
            <input id="canvas-bg-url" type="text" placeholder="URL фона" />
        </label>
        <button id="clear-canvas-bg" class="btn">Очистить фон</button>
        <button id="save-layout" class="btn primary">Сохранить макет</button>
    </div>
</header>

<div id="main">
    <aside id="sidebar">
        <h3>Свойства выбранного блока</h3>

        <label>Текст:
            <input type="text" id="edit-text" placeholder="Текст блока">
        </label>

        <label>Фон:
            <input type="color" id="edit-bg" value="#ffffff">
        </label>

        <label>Цвет текста:
            <input type="color" id="edit-color" value="#000000">
        </label>

        <label>Размер шрифта:
            <input type="number" id="edit-font" min="6" max="72" value="14">
        </label>

        <label>Ширина:
            <input type="number" id="edit-width" min="10" value="100">
        </label>

        <label>Высота:
            <input type="number" id="edit-height" min="10" value="50">
        </label>

        <label>Скругление (px):
            <input type="range" id="border-radius-text" min="0" max="200" value="0">
        </label>

        <hr>

        <label>URL картинки (для image):
            <input type="text" id="edit-image" placeholder="https://...jpg">
        </label>

        <label>Фоновая картинка:
            <input type="text" id="edit-bg-image" placeholder="https://...jpg">
        </label>

        <button id="clear-bg-image" class="btn">Удалить фон блока</button>

        <hr>
        <h3>Слои</h3>

        <div id="layers-panel">
            <ul id="layers-list"></ul>

            <div id="layer-controls">
                <button id="layer-up" class="btn">Выше</button>
                <button id="layer-down" class="btn">Ниже</button>
                <button id="layer-top" class="btn">На верх</button>
                <button id="layer-bottom" class="btn">На низ</button>
            </div>
        </div>


        <button id="delete-block" class="btn danger">Удалить выбранный блок</button>
    </aside>

    <section id="canvas-wrap">
        <div id="canvas"></div>
    </section>
</div>

<!-- Окно выбора шаблонов -->
<div id="template-selector" class="modal">
    <div class="modal-box">
        <button id="close-template-selector" class="close">✕</button>
        <h3>Выберите шаблон</h3>
        <div class="tpl-list">
            <button class="select-template btn" data-tpl="profile">Профиль</button>
            <button class="select-template btn" data-tpl="skills">Навыки</button>
            <button class="select-template btn" data-tpl="contacts">Контакты</button>
            <button class="select-template btn" data-tpl="project">Проект</button>
            <button class="select-template btn" data-tpl="devcard">Dev Card</button>
            <button class="select-template btn" data-tpl="business">Бизнес</button>
        </div>
    </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
