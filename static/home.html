<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Конструктор визиток — Главная</title>
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #4A90E2, #6DD5FA);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            text-align: center;
            max-width: 500px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        .btn {
            display: inline-block;
            padding: 14px 28px;
            font-size: 18px;
            text-decoration: none;
            border-radius: 10px;
            color: white;
            margin: 10px;
            transition: 0.2s;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.4);
        }

        .btn:hover {
            background: rgba(255,255,255,0.35);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Конструктор Визиток</h1>
    <p>Создавай современные визитки, профили и карточки как в Figma — быстро и удобно.</p>

    <a class="btn" href="/login">Войти</a>
    <a class="btn" href="/register">Регистрация</a>
</div>

</body>
</html>
